<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출퇴근 보고</title>
<style>
  :root{
    --bg: #F6F5F2;
    --ink: #1F2421;
    --ink-soft: #5A6058;
    --line: #DCD9D1;
    --accent: #00B1CC;
    --accent-soft: #E1F6FA;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px 16px;
  }
  .wrap{ width:100%; max-width:400px; }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin-bottom:3px;
  }
  h1{
    font-size:19px;
    margin:0 0 12px 0;
    letter-spacing:-0.01em;
  }
  .card {
    background: var(--card);
    border:1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight:600;
    color: var(--ink-soft);
    margin-bottom: 5px;
    margin-top: 12px;
  }
  label:first-of-type{ margin-top:0; }
  .date-display {
    padding: 8px 12px;
    background: var(--accent-soft);
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink);
    font-weight: 600;
  }
  .toggle-group {
    display: flex;
    gap: 7px;
  }
  .toggle-btn {
    flex: 1;
    padding: 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--ink);
    font-family: inherit;
  }
  .toggle-btn:hover{ border-color: var(--accent); }
  .toggle-btn.active {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
    font-weight: 700;
  }
  .quick-label-row{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:8px;
    margin-bottom:5px;
  }
  .quick-label{
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
    text-align:center;
  }
  .quick-hours{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:8px;
    margin-bottom:12px;
  }
  .quick-hours button{
    padding:13px 2px;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:#fff;
    color:var(--ink);
    font-size:13px;
    font-weight:700;
    font-family:inherit;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
  }
  .quick-hours button:hover{ border-color:var(--accent); }
  .quick-hours button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  .quick-hours button.more-btn{
    background:var(--accent-soft);
    border-color:var(--accent-soft);
    color:var(--accent);
  }
  .quick-hours button.more-btn:hover{
    border-color:var(--accent);
  }
  .quick-hours button.more-btn.expanded{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .hour-grid.hidden{
    display:none;
  }
  .hour-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
    gap:5px;
    margin-bottom:12px;
  }
  .hour-grid button{
    padding:6px 0;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
    font-size:12px;
    font-family:inherit;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
  }
  .hour-grid button:hover{ border-color:var(--accent); }
  .hour-grid button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  .min-toggle{
    display:flex;
    gap:8px;
  }
  .min-toggle button{
    flex:1;
    padding:9px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    transition: all 0.15s;
  }
  .min-toggle button:hover{ border-color:var(--accent); }
  .min-toggle button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  .result-divider{
    border:none;
    border-top:1px solid var(--line);
    margin:22px 0 4px;
  }
  .result-label{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .preview {
    margin-top: 4px;
    padding: 12px;
    background: #FFEFE8;
    border-radius: 9px;
    font-size: 14px;
    font-weight:600;
    color: var(--ink);
    min-height: 20px;
    word-break: keep-all;
  }
  .copy-btn {
    margin-top: 14px;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 10px;
    background: #FF6B4A;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(255,107,74,0.35);
    transition: opacity 0.15s, transform 0.1s;
  }
  .copy-btn:hover{ opacity:0.92; }
  .copy-btn:active{ transform: scale(0.99); }
  .copy-btn.copied {
    background: #2F9E5B;
    box-shadow: 0 4px 14px rgba(47,158,91,0.35);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">대학내일</div>
  <h1>출퇴근 보고</h1>

  <div class="card">
    <label>날짜</label>
    <div class="date-display" id="dateDisplay">-</div>

    <label>시간</label>
    <div class="quick-hours" id="quickHours"></div>
    <div class="hour-grid hidden" id="hourGrid"></div>
    <div class="min-toggle" id="minToggle">
      <button type="button" data-min="0">:00</button>
      <button type="button" data-min="30">:30</button>
    </div>

    <label>근무 형태</label>
    <div class="toggle-group" id="locGroup">
      <button class="toggle-btn active" data-loc="home">🏠 재택</button>
      <button class="toggle-btn" data-loc="office">🏢 사무실</button>
    </div>

    <label>구분</label>
    <div class="toggle-group" id="dirGroup">
      <button class="toggle-btn active" data-dir="start">🌅 시작/출근</button>
      <button class="toggle-btn" data-dir="end">🌙 종료/퇴근</button>
    </div>

    <hr class="result-divider">
    <div class="result-label">결과</div>
    <div class="preview" id="preview">-</div>

    <button class="copy-btn" id="copyBtn">문구 복사하기</button>
  </div>
</div>

<script>
  const days = ['일','월','화','수','목','금','토'];
  const preview = document.getElementById('preview');
  const copyBtn = document.getElementById('copyBtn');
  const dateDisplay = document.getElementById('dateDisplay');
  const hourGrid = document.getElementById('hourGrid');
  const minToggle = document.getElementById('minToggle');
  const locGroup = document.getElementById('locGroup');
  const dirGroup = document.getElementById('dirGroup');

  const quickHours = document.getElementById('quickHours');

  let currentLoc = 'home';   // home | office
  let currentDir = 'start';  // start | end
  const timeState = { hour: 9, min: 0 };

  function selectHour(h){
    timeState.hour = h;
    document.querySelectorAll('#quickHours button, #hourGrid button').forEach(b=>{
      b.classList.toggle('active', parseInt(b.dataset.hour) === h);
    });
    buildText();
  }

  // 자주 쓰는 시간: 8~10시(오전) / 17~19시(오후) + 더보기, 전부 같은 크기의 한 줄
  const QUICK_GROUPS = [[8,9,10], [17,18,19]];
  QUICK_GROUPS.forEach(hours => {
    hours.forEach(h => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = `${h}시`;
      btn.dataset.hour = h;
      if (h === timeState.hour) btn.classList.add('active');
      btn.addEventListener('click', () => selectHour(h));
      quickHours.appendChild(btn);
    });
  });
  const moreBtn = document.createElement('button');
  moreBtn.type = 'button';
  moreBtn.className = 'more-btn';
  moreBtn.textContent = '더보기';
  moreBtn.addEventListener('click', () => {
    const isHidden = hourGrid.classList.toggle('hidden');
    moreBtn.textContent = isHidden ? '더보기' : '접기';
    moreBtn.classList.toggle('expanded', !isHidden);
  });
  quickHours.appendChild(moreBtn);

  // 오늘 날짜 고정
  const today = new Date();
  const y = today.getFullYear();
  const m = today.getMonth() + 1;
  const d = today.getDate();
  const dayName = days[today.getDay()];
  dateDisplay.textContent = `${y}년 ${m}월 ${d}일 (${dayName})`;

  // 전체 시간(6~27시) - "다른 시간 선택" 안에 작은 그리드로
  for (let h = 6; h <= 27; h++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = h;
    btn.dataset.hour = h;
    if (h === timeState.hour) btn.classList.add('active');
    btn.addEventListener('click', () => selectHour(h));
    hourGrid.appendChild(btn);
  }
  minToggle.querySelectorAll('button').forEach(btn => {
    if (parseInt(btn.dataset.min) === timeState.min) btn.classList.add('active');
    btn.addEventListener('click', () => {
      timeState.min = parseInt(btn.dataset.min);
      minToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      buildText();
    });
  });

  function typeLabel(loc, dir) {
    if (loc === 'home' && dir === 'start') return '재택근무 시작합니다';
    if (loc === 'home' && dir === 'end')   return '재택근무 종료합니다';
    if (loc === 'office' && dir === 'start') return '출근합니다';
    if (loc === 'office' && dir === 'end')   return '퇴근합니다';
  }

  function formatTime(h, m) {
    return `${h}:${String(m).padStart(2,'0')}`;
  }

  function buildText() {
    const timeStr = formatTime(timeState.hour, timeState.min);
    const text = `${m}/${d}(${dayName}) ${timeStr} ${typeLabel(currentLoc, currentDir)}`;
    preview.textContent = text;
    return text;
  }

  locGroup.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      locGroup.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentLoc = btn.dataset.loc;
      buildText();
    });
  });

  dirGroup.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      dirGroup.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentDir = btn.dataset.dir;
      buildText();
    });
  });

  copyBtn.addEventListener('click', async () => {
    const text = buildText();
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    copyBtn.textContent = '복사됐어요 ✓';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = '문구 복사하기';
      copyBtn.classList.remove('copied');
    }, 1200);
  });

  buildText();
</script>
</body>
</html>
