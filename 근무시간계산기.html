<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근무시간 계산기</title>
<style>
  :root{
    --bg: #F6F5F2;
    --ink: #1F2421;
    --ink-soft: #5A6058;
    --line: #DCD9D1;
    --accent: #00B1CC;
    --accent-soft: #E1F6FA;
    --card: #FFFFFF;
    --danger: #B3543F;
    --danger-soft: #F5E9E5;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 20px;
  }
  .wrap{ width:100%; max-width:480px; }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin-bottom:6px;
  }
  h1{
    font-size:22px;
    margin:0 0 4px 0;
    letter-spacing:-0.01em;
  }
  .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 24px 0;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
    margin-bottom:16px;
  }
  .field{ margin-bottom:16px; }
  .field:last-child{ margin-bottom:0; }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:7px;
  }
  input[type="time"], input[type="date"], select{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:15px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  input:focus, select:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .row2{ display:flex; gap:10px; }
  .row2 > div{ flex:1; }
  .checkbox-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 14px;
    background:var(--accent-soft);
    border-radius:8px;
    cursor:pointer;
  }
  .checkbox-row input{ width:17px; height:17px; accent-color:var(--accent); cursor:pointer; }
  .checkbox-row span{ font-size:14px; color:var(--ink); }
  .hour-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
    gap:6px;
    margin-bottom:8px;
  }
  .hour-grid button{
    padding:8px 0;
    border:1px solid var(--line);
    border-radius:7px;
    background:#fff;
    color:var(--ink);
    font-size:13px;
    font-family:inherit;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
  }
  .hour-grid button:hover{ border-color:var(--accent); }
  .hour-grid button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  .min-toggle{
    display:flex;
    gap:6px;
  }
  .min-toggle button{
    flex:1;
    padding:9px 0;
    border:1px solid var(--line);
    border-radius:7px;
    background:#fff;
    color:var(--ink);
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
  }
  .min-toggle button:hover{ border-color:var(--accent); }
  .min-toggle button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  button.primary{
    width:100%;
    margin-top:18px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  button.primary:hover{ opacity:0.92; }
  button.primary:disabled{ opacity:0.5; cursor:not-allowed; }

  .summary{
    background:var(--ink);
    color:#fff;
    border-radius:14px;
    padding:24px;
    text-align:center;
    margin-bottom:16px;
  }
  .summary .label{
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:#B9C4BE;
    margin-bottom:8px;
  }
  .summary .value{
    font-size:36px;
    font-weight:700;
    letter-spacing:-0.02em;
    font-variant-numeric:tabular-nums;
  }
  .summary .value.zero{ color:#8FD4B8; }
  .summary .value.plus{ color:#E8C97A; }
  .summary .value.minus{ color:#E8A08E; }
  .summary .hint{
    margin-top:8px;
    font-size:12px;
    color:#8B9691;
  }

  .entry{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 4px;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .entry:last-child{ border-bottom:none; }
  .entry .date{
    font-size:14px;
    font-weight:700;
    width:56px;
    flex-shrink:0;
  }
  .entry .detail{
    flex:1;
    min-width:0;
  }
  .entry .detail .times{
    font-size:13px;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .entry .detail .meta{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .entry .diff{
    font-size:15px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
    min-width:44px;
    text-align:right;
  }
  .entry .diff.zero{ color:var(--ink-soft); }
  .entry .diff.plus{ color:var(--accent); }
  .entry .diff.minus{ color:var(--danger); }
  .entry .del{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:18px;
    cursor:pointer;
    padding:2px 6px;
    flex-shrink:0;
    line-height:1;
  }
  .entry .del:hover{ color:var(--danger); }
  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:24px 0;
  }
  .footnote{
    margin-top:14px;
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:center;
    line-height:1.6;
  }
  .footnote button{
    background:none;
    border:none;
    color:var(--danger);
    font-size:11.5px;
    text-decoration:underline;
    cursor:pointer;
    font-family:inherit;
    padding:0;
  }
  .status{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    padding:8px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">대학내일</div>
  <h1>순 근무 시간 체크</h1>
  <p class="sub">일 8시간 기준 +/- 를 날짜별로 쌓아서 상쇄 확인</p>

  <div class="summary">
    <div class="label">누적 상쇄 합계</div>
    <div class="value" id="summaryValue">–</div>
    <div class="hint" id="summaryHint">기록을 추가하면 계산됩니다</div>
  </div>

  <div class="card">
    <div class="field">
      <label>날짜</label>
      <input type="date" id="entryDate">
    </div>
    <div class="field">
      <label>🌅 근무 시작</label>
      <div class="hour-grid" id="startHourGrid"></div>
      <div class="min-toggle" id="startMinToggle">
        <button type="button" data-min="0">:00</button>
        <button type="button" data-min="30">:30</button>
      </div>
    </div>
    <div class="field">
      <label class="checkbox-row" for="noLunch">
        <input type="checkbox" id="noLunch">
        <span>🍚 점심 없이 근무 (1시간 차감 안 함)</span>
      </label>
    </div>
    <div class="field">
      <label>🌙 근무 종료</label>
      <div class="hour-grid" id="endHourGrid"></div>
      <div class="min-toggle" id="endMinToggle">
        <button type="button" data-min="0">:00</button>
        <button type="button" data-min="30">:30</button>
      </div>
    </div>
    <div class="field">
      <label>휴게시간</label>
      <select id="breakTime"></select>
    </div>
    <button class="primary" id="addBtn">이 날짜 기록 추가</button>
  </div>

  <div class="card" id="listCard">
    <div id="entryList"><div class="empty">기록이 없습니다</div></div>
  </div>

  <div class="status" id="statusMsg"></div>

  <div class="footnote">
    계산식 · 근무시간 = 종료−시작 − 점심 1시간(체크 시 미차감) − 휴게시간 · 8시간 기준 대비 0.5h 단위로 +/- 표시<br>
    상쇄된(합 0) 날짜는 자동으로 지워지지 않습니다 — 직접 <span style="color:var(--ink)">×</span> 눌러 삭제하세요.<br>
    <button id="clearAllBtn">전체 기록 초기화</button>
  </div>
</div>

<script>
  const STORAGE_KEY = 'worklog-entries';

  const dateInput = document.getElementById('entryDate');
  const startHourGrid = document.getElementById('startHourGrid');
  const endHourGrid = document.getElementById('endHourGrid');
  const startMinToggle = document.getElementById('startMinToggle');
  const endMinToggle = document.getElementById('endMinToggle');
  const noLunch = document.getElementById('noLunch');
  const breakTime = document.getElementById('breakTime');
  const addBtn = document.getElementById('addBtn');
  const entryList = document.getElementById('entryList');
  const summaryValue = document.getElementById('summaryValue');
  const summaryHint = document.getElementById('summaryHint');
  const statusMsg = document.getElementById('statusMsg');
  const clearAllBtn = document.getElementById('clearAllBtn');

  let entries = [];

  // 시각 상태: 6:00 ~ 28:00 (야간 근무 대비, 28:00 = 다음날 새벽 4시)
  const timeState = {
    startHour: 9, startMin: 0,
    endHour: 18, endMin: 0
  };

  function buildHourGrid(gridEl, kind, minH, maxH){
    for(let h=minH; h<=maxH; h++){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = h;
      btn.dataset.hour = h;
      if(h === timeState[kind+'Hour']) btn.classList.add('active');
      btn.addEventListener('click', ()=>{
        timeState[kind+'Hour'] = h;
        gridEl.querySelectorAll('button').forEach(b=> b.classList.toggle('active', parseInt(b.dataset.hour)===h));
      });
      gridEl.appendChild(btn);
    }
  }
  buildHourGrid(startHourGrid, 'start', 6, 18);
  buildHourGrid(endHourGrid, 'end', 13, 26);

  function wireMinToggle(toggleEl, kind){
    toggleEl.querySelectorAll('button').forEach(btn=>{
      if(parseInt(btn.dataset.min) === timeState[kind+'Min']) btn.classList.add('active');
      btn.addEventListener('click', ()=>{
        timeState[kind+'Min'] = parseInt(btn.dataset.min);
        toggleEl.querySelectorAll('button').forEach(b=> b.classList.toggle('active', b===btn));
      });
    });
  }
  wireMinToggle(startMinToggle, 'start');
  wireMinToggle(endMinToggle, 'end');

  function buildBreakOptions(){
    for(let m=0; m<=8*60; m+=30){
      const h = m/60;
      const opt = document.createElement('option');
      opt.value = h;
      opt.textContent = h === 0 ? '없음' : (Number.isInteger(h) ? `${h}시간` : `${Math.floor(h)}시간 30분`);
      breakTime.appendChild(opt);
    }
  }
  buildBreakOptions();

  const today = new Date();
  dateInput.value = today.toISOString().slice(0,10);

  function formatTimeLabel(h, m){
    return `${h}:${String(m).padStart(2,'0')}`;
  }

  function toMinutes(t){
    const [h,m] = t.split(':').map(Number);
    return h*60+m;
  }

  function formatMD(dateStr){
    const [, mo, d] = dateStr.split('-');
    return `${parseInt(mo)}/${parseInt(d)}`;
  }

  function formatDiff(diffH){
    if(diffH === 0) return '0h';
    const sign = diffH > 0 ? '+' : '-';
    const abs = Math.abs(diffH);
    return `${sign}${abs}h`;
  }

  function formatWorked(min){
    const h = Math.floor(min/60);
    const m = Math.round(min%60);
    return m === 0 ? `${h}시간` : `${h}시간 ${m}분`;
  }

  function computeEntry({date, start, end, noLunch, breakTime}){
    const raw = toMinutes(end) - toMinutes(start);
    const lunchDeduct = noLunch ? 0 : 60;
    const breakDeduct = breakTime * 60;
    const workedMin = raw - lunchDeduct - breakDeduct;
    const workedH = Math.round((workedMin/60)*2)/2;
    const diffH = Math.round((workedH - 8)*2)/2;
    return { date, start, end, noLunch, breakTime, workedMin, workedH, diffH };
  }

  function render(){
    entries.sort((a,b)=> a.date.localeCompare(b.date));

    if(entries.length === 0){
      entryList.innerHTML = '<div class="empty">기록이 없습니다</div>';
    } else {
      entryList.innerHTML = '';
      entries.forEach((e, idx)=>{
        const diffClass = e.diffH === 0 ? 'zero' : (e.diffH > 0 ? 'plus' : 'minus');
        const div = document.createElement('div');
        div.className = 'entry';
        div.innerHTML = `
          <div class="date">${formatMD(e.date)}</div>
          <div class="detail">
            <div class="times">${e.start}\u2013${e.end}</div>
            <div class="meta">${formatWorked(e.workedMin)}${e.noLunch ? ' · 점심 미차감' : ''}${e.breakTime > 0 ? ' · 휴게 ' + e.breakTime + 'h' : ''}</div>
          </div>
          <div class="diff ${diffClass}">${formatDiff(e.diffH)}</div>
          <button class="del" data-idx="${idx}" title="삭제">×</button>
        `;
        entryList.appendChild(div);
      });
      entryList.querySelectorAll('.del').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const idx = parseInt(btn.dataset.idx);
          entries.splice(idx,1);
          await save();
          render();
        });
      });
    }

    const total = entries.reduce((sum,e)=> sum + e.diffH, 0);
    const totalRounded = Math.round(total*2)/2;
    summaryValue.textContent = formatDiff(totalRounded);
    summaryValue.className = 'value ' + (totalRounded === 0 ? 'zero' : (totalRounded > 0 ? 'plus' : 'minus'));
    if(entries.length === 0){
      summaryHint.textContent = '기록을 추가하면 계산됩니다';
    } else if(totalRounded === 0){
      summaryHint.textContent = `${entries.length}건 상쇄 완료 — 올릴 시간 없음`;
    } else {
      summaryHint.textContent = `${entries.length}건 기록 중`;
    }
  }

  async function load(){
    statusMsg.textContent = '불러오는 중...';
    try{
      const result = await window.storage.get(STORAGE_KEY, false);
      entries = result && result.value ? JSON.parse(result.value) : [];
    }catch(err){
      entries = [];
    }
    statusMsg.textContent = '';
    render();
  }

  async function save(){
    try{
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
      if(!result){
        statusMsg.textContent = '저장 실패 — 다시 시도해주세요';
      } else {
        statusMsg.textContent = '';
      }
    }catch(err){
      statusMsg.textContent = '저장 실패 — 다시 시도해주세요';
    }
  }

  addBtn.addEventListener('click', async ()=>{
    if(!dateInput.value){
      statusMsg.textContent = '날짜를 선택해주세요';
      return;
    }
    const startStr = formatTimeLabel(timeState.startHour, timeState.startMin);
    const endStr = formatTimeLabel(timeState.endHour, timeState.endMin);
    if(toMinutes(endStr) <= toMinutes(startStr)){
      statusMsg.textContent = '종료 시각이 시작 시각보다 빨라요';
      return;
    }
    addBtn.disabled = true;
    const entry = computeEntry({
      date: dateInput.value,
      start: startStr,
      end: endStr,
      noLunch: noLunch.checked,
      breakTime: parseFloat(breakTime.value)
    });
    const existingIdx = entries.findIndex(e => e.date === entry.date);
    if(existingIdx >= 0){
      entries[existingIdx] = entry;
    } else {
      entries.push(entry);
    }
    await save();
    render();
    addBtn.disabled = false;
  });

  clearAllBtn.addEventListener('click', async ()=>{
    if(!confirm('전체 기록을 삭제할까요? 되돌릴 수 없습니다.')) return;
    entries = [];
    await save();
    render();
  });

  load();
</script>
</body>
</html>
